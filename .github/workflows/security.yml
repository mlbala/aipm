name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # lists a PR's commits
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan with gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          enable-cache: false

      # Explicit rule packs, never --config auto (ARCHITECTURE §13.3). semgrep itself is pinned;
      # the packs are fetched from the registry on each run (vendoring them is a follow-up).
      # Excludes: .semgrepignore.
      - name: Scan with semgrep
        run: >-
          uvx --from semgrep==1.182.1 semgrep scan
          --config p/python --config p/secrets
          --metrics off --error .

  osv-scanner:
    name: Dependencies (osv-scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan uv.lock with osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=uv.lock

  zizmor:
    name: Workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --only-group dev zizmor --format=github .github/

  shellcheck:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner image installs shellcheck from Ubuntu's signed archive (ubuntu-24.04: 0.9.0).
      # Should an image drop it, it comes from the same archive; a binary is never downloaded.
      - name: Check shellcheck is installed
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends shellcheck
          fi
          command -v shellcheck || { echo "::error::shellcheck is not installed"; exit 1; }
          shellcheck --version

      # Every shell script, named one by one; --norc so no .shellcheckrc can turn checks off.
      # tests/security/test_v04_d3_7_shellcheck.py fails when a script is added and not named here.
      - name: Check the shell scripts
        run: >-
          shellcheck --norc --shell=sh --severity=style
          install.sh
          .githooks/pre-push
          .githooks/commit-msg
          tests/fakes/bin/gitleaks
          tests/fakes/bin/osv-scanner
          tests/fakes/bin/semgrep
          tests/fakes/bin/srt
          tests/fakes/bin/trivy
