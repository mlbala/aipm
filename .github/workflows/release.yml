name: Release

# On a v* tag (pushed by the owner only; the pre-push hook needs AIPM_RELEASE_TAG=1): build the
# sdist and wheel, a CycloneDX SBOM of the locked dependencies and SHA-256 checksums, attest
# the build's provenance, and publish a GitHub Release (ARCHITECTURE §21, SECURITY.md §12.1).
# The build runs with read-only permissions; only the release job can write, and it runs no
# project code. Users verify a release with `gh attestation verify` (README, "Verifying a
# release").

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the tag
          persist-credentials: false

      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::the tagged commit is not on main; nothing is released"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: false

      - name: Build the sdist and wheel
        run: uv build --no-sources --out-dir dist

      - name: SBOM (CycloneDX)
        run: uv export --frozen --format cyclonedx1.5 --no-dev --all-extras --output-file dist/aipm.cdx.json

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Keep the files for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - name: Fetch the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check the checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/aipm.cdx.json

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${REPO}" --verify-tag --title "aipm ${TAG}" --generate-notes
