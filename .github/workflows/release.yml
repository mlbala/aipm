name: Release

# Stub until build prompt 08 adds the real pipeline: uv build, a CycloneDX SBOM, build
# provenance attestation, checksums and a GitHub Release (ARCHITECTURE §21). Until then a tag
# push builds and publishes nothing: the job has no permissions and no build or publish step,
# so nothing is ever released by accident. It passes with a notice rather than failing,
# because the run order (docs/prompts/README.md) tags v0.1.0 to v0.3.0 before prompt 08, and
# a milestone tag is not a failed release.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release (not implemented yet)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Publish nothing
        env:
          TAG: ${{ github.ref_name }}
        run: |
          message="No release was built for ${TAG}: the release pipeline arrives in build prompt 08. Nothing was published."
          echo "::notice::${message}"
          echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
