name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: each push's commit-authorship check covers only its own commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags and history
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
          enable-cache: false

      - name: Install
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Types (pyright, strict)
        run: uv run --frozen pyright

      - name: Layers (import-linter)
        run: uv run --frozen lint-imports

      - name: Tests with coverage
        run: uv run --frozen pytest --cov --cov-report=term

  # The run's package cache under the real srt (ADR-0031; red-team v0.3 rec 3). srt and pnpm
  # come from .github/sandbox/package-lock.json at exact versions, installed with no scripts.
  sandbox:
    name: Real sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags and history
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.15.0" # srt needs Node 22.12 or later
          package-manager-cache: false

      - name: Install srt and pnpm (locked, no install scripts)
        working-directory: .github/sandbox
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Put srt and pnpm on PATH
        run: echo "$GITHUB_WORKSPACE/.github/sandbox/node_modules/.bin" >> "$GITHUB_PATH"

      # srt on Linux runs bubblewrap, and needs socat for its network proxy and ripgrep to find
      # protected files. Ubuntu 24.04 lets AppArmor deny unprivileged user namespaces, which
      # bubblewrap needs, so this throwaway runner turns that restriction off. It weakens only
      # this runner's kernel hardening; on their own machines users can allow just bwrap with
      # an AppArmor profile instead (README, "Install").
      - name: Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install
        run: uv sync --frozen --all-extras

      - name: Tests under the real sandbox
        env:
          AIPM_REQUIRE_REAL_SRT: "1"
        run: uv run --frozen pytest -q -rs tests/security/test_real_sandbox.py tests/security/test_gates.py

  commit-authorship:
    name: Commit authorship
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every new commit is the owner's, with no AI attribution
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          fi
          # A new branch has no "before" commit: compare with the default branch instead.
          case "$base" in *[!0]*) ;; *) base="$(gh api "repos/$REPO" --jq .default_branch)" ;; esac

          expected="$(gh api "repos/$REPO/compare/$base...$head" --jq .total_commits)"
          gh api --paginate "repos/$REPO/compare/$base...$head?per_page=100" \
            --jq '.commits[] | {sha: .sha[0:12], login: (.author.login // ""), committer: (.committer.login // ""), message: .commit.message}' \
            > commits.jsonl

          fail=0
          # Fail closed if the API returned fewer commits than the comparison holds.
          checked="$(wc -l < commits.jsonl | tr -d ' ')"
          if [ "$checked" != "$expected" ]; then
            echo "::error::Read $checked commits but the comparison holds $expected."
            fail=1
          fi

          # The author must be a GitHub account: the owner, or Dependabot. An email that is not
          # linked to any account has no login and fails. The committer must be the owner, or
          # GitHub itself (web-flow) for merges and edits made on github.com, or Dependabot.
          # "|" never appears in a login, and unlike a tab it does not collapse empty fields.
          while IFS='|' read -r sha login committer; do
            if [ "$login" != "$OWNER" ] && [ "$login" != "dependabot[bot]" ]; then
              echo "::error::Commit $sha is authored by '${login:-an unlinked email}', not $OWNER."
              fail=1
            fi
            case "$committer" in
              "$OWNER" | web-flow | "dependabot[bot]") ;;
              *)
                echo "::error::Commit $sha was committed by '${committer:-an unlinked email}', not $OWNER."
                fail=1
                ;;
            esac
          done < <(jq -r '[.sha, .login, .committer] | join("|")' commits.jsonl)

          # No co-author, session or "Generated with" lines (AGENTS.md "Git").
          attributed="$(jq -r 'select(.message | split("\n") | any(test("^(co-authored-by:|claude-session:)|generated with \\[?claude"; "i"))) | .sha' commits.jsonl)"
          for sha in $attributed; do
            echo "::error::Commit $sha has a co-author or AI attribution line."
            fail=1
          done

          echo "Checked $checked commits between $base and $head."
          exit "$fail"
