# Stack template: node-npm with jest (ARCHITECTURE §13.1, build prompt 06).
# Tools run as `node node_modules/<tool>/...`, never through `npm run` (package.json scripts run
# through a shell) or `npm exec`/`npx` (they can fetch packages). The prepare step is the only
# place packages are installed, from the lockfile, with install scripts off.
allowed_executables:                  # argv prefixes (SECURITY.md §10 rule 2)
  - [npm, ci, --ignore-scripts]
  - [node, node_modules/eslint/bin/eslint.js]
  - [node, node_modules/prettier/bin/prettier.cjs]
  - [node, node_modules/typescript/bin/tsc]
  - [node, node_modules/jest/bin/jest.js]
test_roots: [tests, __tests__]        # where {test_paths} looks for owned tests
prepare: {run: [npm, ci, --ignore-scripts], network: registries}
gates:
  lint: {run: [node, node_modules/eslint/bin/eslint.js, "{paths}"], required: true}
  format: {run: [node, node_modules/prettier/bin/prettier.cjs, --check, "{paths}"], required: false}
  types: {run: [node, node_modules/typescript/bin/tsc, --noEmit], required: false}
  unit:
    run: [node, node_modules/jest/bin/jest.js, --ci, --json, --outputFile, "{report_file}",
          "{test_paths}"]
    required: true
  secrets: {builtin: gitleaks, required: true}
  sast: {builtin: semgrep, fail_on: high, required: false}
  deps: {builtin: osv, fail_on: high, required: true}
  ac_trace: {builtin: ac_trace, required: true}
  ac_review: {builtin: ac_review, mode: veto, required: false}
