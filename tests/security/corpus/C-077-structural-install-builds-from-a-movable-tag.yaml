id: C-077
vector: structural
input:
  surface: install.sh
  # install.sh built aipm from the tag's source, with the build backend resolved at install
  # time, so it installed neither the attested wheel nor necessarily the tagged code (R-21);
  # the uv installer was pinned by URL, not by content (red-team v0.4, N-7).
  text: |
    sh "$installer"
    uv tool install "git+https://github.com/mlbala/aipm@$TAG"
expected:
  outcome: >-
    The uv installer runs only when its SHA-256 matches the pinned one; the release's wheel is
    installed only when its SHA-256 matches SHA256SUMS and, with gh installed, its attestation
    from the release workflow for that tag verifies. A tag older than v0.4.0 is refused (exit 2)
    with the source-build command printed, and nothing is downloaded.
  exit_code: 2
