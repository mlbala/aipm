id: C-034
vector: smuggling
input:
  surface: log-record
  # An escape sequence inside a secret, as colored tool output produces. The test puts a registered
  # fake secret around it: <head> is its first ten characters, <tail> the rest (RT01-4).
  text: "value <head>\x1b[0m<tail> and <head>\x07<tail>"
expected:
  outcome: >-
    Logging strips escape sequences and control characters before it redacts, so the secret is
    whole when the redactor sees it and never reaches a log line or the log file (invariant I-5).
  exit_code: 0
