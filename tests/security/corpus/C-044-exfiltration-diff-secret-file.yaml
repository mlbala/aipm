id: C-044
vector: exfiltration
input:
  surface: agent-diff:new-file
  # An owned file named like a credential file, holding a token in a format the redactor does
  # not know (RT02-5). <secret> is replaced by a value no pattern matches.
  text: |
    [default]
    session = <secret>
expected:
  outcome: >-
    The AC reviewer's diff names the file but never shows its contents (SECURITY.md §7.1 deny
    list, and .aipmignore); when the secrets gate fails, the reviewer is not asked at all. The
    value never appears in an LLM request (invariant I-5).
