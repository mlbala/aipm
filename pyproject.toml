[build-system]
requires = ["hatchling>=1.33", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "aipm"
description = "An AI product manager for your terminal: interviews, specs, plans, prompts and verified builds."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Balakrishnan" }]
requires-python = ">=3.13"
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
# Runtime dependencies: ARCHITECTURE §19, lower bounds only.
dependencies = [
    "typer>=0.27",
    "rich>=15.0",
    "questionary>=2.1",
    "pydantic>=2.14",
    "ruamel.yaml>=0.19",
    "jinja2>=3.1.6",        # 3.1.6 fixes a sandbox escape; aipm relies on SandboxedEnvironment
    "filelock>=4.2",
    "platformdirs>=4.13",
    "pathspec>=1.1",
    "anthropic>=2.0.0",     # first release that sends API version 2026-10-21 (ARCHITECTURE §14)
    "openai>=3.40",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]
keyring = ["keyring>=25.7"]

[project.scripts]
aipm = "aipm.cli.main:app"

[project.urls]
Homepage = "https://github.com/mlbala/aipm"
Source = "https://github.com/mlbala/aipm"
Issues = "https://github.com/mlbala/aipm/issues"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-socket>=0.8.1",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "syrupy>=6.1",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "import-linter>=2.15",
    "zizmor==1.31.1",
]

# ---------------------------------------------------------------- build

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/aipm/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aipm"]

[tool.hatch.build.targets.sdist]
include = ["src/aipm", "tests", "docs", "examples", "README.md", "LICENSE", "SECURITY.md", "CHANGELOG.md"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# A deliberately violating fixture; tests/security/test_banned_api.py lints it explicitly.
extend-exclude = ["tests/security/fixtures/banned_apis.py"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP",
    "S",       # bandit
    "PTH", "RUF", "ASYNC",
    "PL",      # pylint, with the noisy rules ignored below
    "T20",     # no print()
    "TID251",  # banned APIs (ARCHITECTURE §5.1)
]
ignore = [
    "PLR0913", # too many arguments: run_safe and the CLI commands take many keyword flags
    "PLR0917", # too many positional arguments: Typer commands mirror their flags
    "PLR2004", # magic values
]

[tool.ruff.lint.per-file-ignores]
# No file-wide TID251 exemption, not even for execution/process.py: it imports subprocess with
# a line-level `# noqa: TID251`, and tests/security/test_banned_api.py allows that comment
# nowhere else (ARCHITECTURE §5.1).
"tests/**" = ["S101"]
# The CLI imports use cases and Rich inside the command that needs them, so `aipm --help`
# stays under 300 ms (ARCHITECTURE §20, tests/unit/test_startup.py).
"src/aipm/cli/**" = ["PLC0415"]
# The providers import their SDK when a call is made, never at module import (ARCHITECTURE §5.1).
"src/aipm/llm/providers/**" = ["PLC0415"]
# Only these tests run subprocesses (git, the CLI, ruff, lint-imports) or import dynamically.
"tests/conftest.py" = ["TID251", "S603", "S607"]
"tests/security/test_banned_api.py" = ["TID251", "S603"]
"tests/security/test_layers.py" = ["TID251", "S603"]
"tests/security/test_no_hidden_characters.py" = ["TID251", "S603", "S607"]
"tests/security/test_pre_push_hook.py" = ["TID251", "S603", "S607"]
"tests/unit/test_fixtures.py" = ["TID251", "S603", "S607"]
"tests/unit/test_package_imports.py" = ["TID251"]
"tests/unit/test_startup.py" = ["TID251", "S603"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Only aipm.execution.process may start a process; use run_safe()."
"asyncio.subprocess".msg = "Only aipm.execution.process may start a process; use run_safe_async()."
"asyncio.create_subprocess_exec".msg = "Only aipm.execution.process may start a process; use run_safe_async()."
"asyncio.create_subprocess_shell".msg = "No shell, ever (SECURITY.md §10 rule 1)."
"os.system".msg = "No shell, ever (SECURITY.md §10 rule 1)."
"os.popen".msg = "No shell, ever (SECURITY.md §10 rule 1)."
"os.spawnl".msg = "Only aipm.execution.process may start a process."
"os.spawnle".msg = "Only aipm.execution.process may start a process."
"os.spawnlp".msg = "Only aipm.execution.process may start a process."
"os.spawnlpe".msg = "Only aipm.execution.process may start a process."
"os.spawnv".msg = "Only aipm.execution.process may start a process."
"os.spawnve".msg = "Only aipm.execution.process may start a process."
"os.spawnvp".msg = "Only aipm.execution.process may start a process."
"os.spawnvpe".msg = "Only aipm.execution.process may start a process."
"os.execl".msg = "Only aipm.execution.process may start a process."
"os.execle".msg = "Only aipm.execution.process may start a process."
"os.execlp".msg = "Only aipm.execution.process may start a process."
"os.execlpe".msg = "Only aipm.execution.process may start a process."
"os.execv".msg = "Only aipm.execution.process may start a process."
"os.execve".msg = "Only aipm.execution.process may start a process."
"os.execvp".msg = "Only aipm.execution.process may start a process."
"os.execvpe".msg = "Only aipm.execution.process may start a process."
"os.posix_spawn".msg = "Only aipm.execution.process may start a process."
"os.posix_spawnp".msg = "Only aipm.execution.process may start a process."
"os.fork".msg = "Only aipm.execution.process may start a process."
"os.forkpty".msg = "Only aipm.execution.process may start a process."
"os.startfile".msg = "Only aipm.execution.process may start a process."
"posix".msg = "Use os; posix exposes system(), fork() and exec*() directly."
"_posixsubprocess".msg = "Only aipm.execution.process may start a process."
"pty".msg = "Only aipm.execution.process may start a process."
"multiprocessing".msg = "Only aipm.execution.process may start a process."
"pickle".msg = "Never unpickle data (AGENTS.md rule 1)."
"marshal".msg = "Never unmarshal data (AGENTS.md rule 1)."
"ctypes".msg = "No foreign calls: ctypes can reach system() and exec*() directly."
"concurrent.futures.ProcessPoolExecutor".msg = "Only aipm.execution.process may start a process."
"webbrowser".msg = "webbrowser runs $BROWSER."
"pydoc".msg = "pydoc can run $PAGER."
"runpy".msg = "No running code by path or module name."
"code".msg = "No interactive interpreters."
"codeop".msg = "No compiling code from strings."
"importlib.util".msg = "No loading modules from files or specs."
"importlib.machinery".msg = "No loading modules from files or specs."
"importlib.__import__".msg = "No dynamic imports (ARCHITECTURE §5.1)."
"importlib.import_module".msg = "No dynamic imports; plugins/loader.py gets a line-level exemption in v0.4."
# ruff cannot match the bare `__import__` builtin; tests/security/test_banned_api.py scans for it.
"builtins".msg = "No access to __import__, exec or eval through the builtins module."

# ---------------------------------------------------------------- pyright

[tool.pyright]
include = ["src/aipm"]
strict = ["src/aipm"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--disable-socket", "--strict-markers", "--strict-config", "-ra"]
markers = [
    "timing: wall-clock budget tests; skipped when CI is set unless AIPM_RUN_TIMING=1",
    "live: real-provider smoke tests; skipped unless AIPM_LIVE=1 (never in CI)",
]
xfail_strict = true

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true
source = ["aipm"]
omit = ["src/aipm/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
]

# ---------------------------------------------------------------- import-linter

[tool.importlinter]
root_package = "aipm"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers (ARCHITECTURE §5.1)"
type = "layers"
layers = [
    "aipm.cli",
    "aipm.app",
    "aipm.gates | aipm.adapters | aipm.reporting",
    "aipm.roles | aipm.context",
    "aipm.state : aipm.config : aipm.llm : aipm.execution : aipm.scanners : aipm.observability : aipm.plugins",
    "aipm.domain : aipm.security",
]

[[tool.importlinter.contracts]]
name = "L0 is pure: domain and security import no process, network or LLM SDK modules"
type = "forbidden"
source_modules = ["aipm.domain", "aipm.security"]
forbidden_modules = ["subprocess", "socket", "httpx", "httpx2", "anthropic", "openai"]

# The SDK, subprocess and network contracts cover the whole package, so a new module is covered
# by default; the real exceptions are listed in ignore_imports (step 01 security review, finding 7).
[[tool.importlinter.contracts]]
name = "Only aipm.llm.providers imports the LLM SDKs"
type = "forbidden"
source_modules = ["aipm"]
forbidden_modules = ["anthropic", "openai"]
ignore_imports = ["aipm.llm.providers.* -> anthropic", "aipm.llm.providers.* -> openai"]
allow_indirect_imports = true
# The providers import their SDK from build prompt 03 on.
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only aipm.execution.process imports subprocess"
type = "forbidden"
source_modules = ["aipm"]
forbidden_modules = ["subprocess", "multiprocessing", "pty"]
ignore_imports = ["aipm.execution.process -> subprocess"]
allow_indirect_imports = true

# import-linter does not follow imports inside the standard library or other packages, so the
# network modules are named directly. urllib is forbidden whole: nothing in aipm needs it.
[[tool.importlinter.contracts]]
name = "Only aipm.llm and aipm.scanners.registry import network modules"
type = "forbidden"
source_modules = ["aipm"]
# The LLM SDKs use httpx2 (anthropic>=2.0, openai>=3.40), so it is named as well.
forbidden_modules = [
    "socket", "ssl", "http", "httpx", "httpx2", "ftplib", "smtplib", "xmlrpc", "urllib",
]
ignore_imports = [
    "aipm.llm.** -> socket", "aipm.llm.** -> ssl", "aipm.llm.** -> http",
    "aipm.llm.** -> httpx", "aipm.llm.** -> httpx2", "aipm.llm.** -> urllib",
    "aipm.scanners.registry -> socket", "aipm.scanners.registry -> ssl",
    "aipm.scanners.registry -> http", "aipm.scanners.registry -> httpx",
    "aipm.scanners.registry -> httpx2", "aipm.scanners.registry -> urllib",
]
allow_indirect_imports = true
# The two exceptions: the LLM gateway, and aipm.scanners.registry, the deps gate's HTTPS lookups
# of package existence and first-release age (SECURITY.md §12.2; urllib only, no redirects).
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "cli imports only app, domain.errors and security.sanitize"
type = "forbidden"
source_modules = ["aipm.cli"]
forbidden_modules = [
    "aipm.state", "aipm.config", "aipm.llm", "aipm.execution", "aipm.scanners",
    "aipm.observability", "aipm.plugins", "aipm.roles", "aipm.context", "aipm.adapters",
    "aipm.gates", "aipm.reporting",
    "aipm.domain.models", "aipm.domain.phase", "aipm.domain.coverage", "aipm.domain.dag",
    "aipm.domain.scheduler", "aipm.domain.ids",
    "aipm.security.untrusted", "aipm.security.redact", "aipm.security.paths",
    "aipm.security.command_policy", "aipm.security.diff_checks", "aipm.security.supply_chain",
    "aipm.security.budget", "aipm.security.network",
]
allow_indirect_imports = true
